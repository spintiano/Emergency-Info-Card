<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Emergency Info Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="register">
  <main class="auth-wrap">
    <div class="auth-box">
      <a class="brand" href="../index.html"><span class="med-cross"><i class="fa-solid fa-plus"></i></span><span>Emergency Info Card</span></a>
      <h1>Create your account</h1>
      <p class="muted">It takes less than a minute.</p>

      <form id="register-form" novalidate>
        <div class="form-error" role="alert"></div>

        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" type="text" autocomplete="name">
          <small class="error" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" inputmode="email">
          <small class="error" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" type="password" autocomplete="new-password">
            <button type="button" class="toggle-pass" data-target="password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <span class="hint">At least 8 characters.</span>
          <small class="error" aria-live="polite"></small>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input id="confirmPassword" type="password" autocomplete="new-password">
            <button type="button" class="toggle-pass" data-target="confirmPassword" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <small class="error" aria-live="polite"></small>
        </div>

        <button class="btn btn-primary btn-block" id="submit-btn" type="submit">Sign Up</button>
      </form>

      <p class="auth-foot">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script type="module" src="../js/script.js"></script>
</body>
</html>
