<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Shared Emergency Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="share" style="background:var(--white)">
  <main class="em-main">
    <div class="loading" id="share-loading"><span class="spinner"></span><p>Loading...</p></div>
    <div class="form-error show hidden" id="share-error" role="alert"></div>
    <div id="share-card" class="hidden"></div>
    <p class="notice hidden" id="share-note" style="margin-top:16px"><i class="fa-solid fa-circle-info"></i>The owner chose what appears on this card.</p>
  </main>
  <script type="module" src="../js/script.js"></script>
</body>
</html>
